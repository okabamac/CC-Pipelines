// ── Incident category → color ──────────────────────────────────────────
const CAT_COLORS = {
  'PV':'#ef4444','PIPELINE VANDALISM':'#ef4444',
  'OIL SPILL':'#f97316','SPILL':'#f97316','CRUDE OIL SPILL':'#f97316',
  'THEFT':'#eab308','OIL THEFT':'#eab308','EQUIPMENT THEFT':'#eab308',
  'IC':'#22c55e','ILLEGAL CONNECTION':'#22c55e',
  'IR':'#06b6d4','ILLEGAL REFINERY':'#06b6d4',
  'EV':'#8b5cf6','EQUIPMENT VANDALISM':'#8b5cf6',
  'GSIA':'#ec4899'
};

function getCatColor(cat) {
  if (!cat) return '#94a3b8';
  const u = cat.toString().toUpperCase().trim();
  for (const [k,v] of Object.entries(CAT_COLORS)) {
    if (u.includes(k)) return v;
  }
  return '#94a3b8';
}

// ── Map init ───────────────────────────────────────────────────────────
const map = L.map('map', {
  center:[4.85, 6.50], zoom:8,
  zoomControl:true, attributionControl:false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  subdomains:'abcd', maxZoom:18
}).addTo(map);

// ── Draw pipelines ─────────────────────────────────────────────────────
PIPELINES.forEach(p => {
  const latlngs = p.c.map(c => [c[1], c[0]]);
  const line = L.polyline(latlngs, {
    color: p.col,
    weight: Math.min(p.w, 3),
    opacity: 0.85,
    smoothFactor: 1
  }).addTo(map);
  if (p.n) {
    line.bindTooltip(p.n, { sticky:true, direction:'top', offset:[0,-4] });
  }
});

// ── Incident layer (replaceable) ───────────────────────────────────────
let incidentLayer = L.layerGroup().addTo(map);

function renderIncidents(incidents) {
  incidentLayer.clearLayers();
  incidents.forEach(inc => {
    const lat = parseFloat(inc.lat);
    const lng = parseFloat(inc.lng);
    if (isNaN(lat) || isNaN(lng)) return;
    const color = getCatColor(inc.cat);
    const marker = L.circleMarker([lat, lng], {
      radius:7, fillColor:color,
      color:'rgba(255,255,255,0.3)', weight:1.5, fillOpacity:0.9
    }).addTo(incidentLayer);
    marker.bindPopup(`
      <div style="min-width:155px">
        <div class="pc" style="background:${color}22;color:${color};border:1px solid ${color}44">
          ${inc.cat || 'Unknown'}
        </div>
        <div class="pr">Community: <span>${inc.community || '—'}</span></div>
        <div class="pr">Lat: <span>${lat.toFixed(5)}</span></div>
        <div class="pr">Lng: <span>${lng.toFixed(5)}</span></div>
      </div>
    `);
  });
}

// ── Listen for incident data posted from Power BI ──────────────────────
window.addEventListener('message', function(event) {
  try {
    const msg = JSON.parse(event.data);
    if (msg.type === 'IMRA_INCIDENTS' && Array.isArray(msg.data)) {
      renderIncidents(msg.data);
    }
  } catch(e) {}
});

// ── Fallback: render empty on load ─────────────────────────────────────
renderIncidents([]);
</script>
